[project]
name = "build-ai-systems"
version = "0.1.0"
description = "Public project repository for the Build AI Systems course."
requires-python = ">=3.11"
dependencies = [
  "openai>=2.44.0",
  "pydantic>=2.13.4",
  "pydantic-ai-slim[anthropic,openai]>=1.0.0",
  "python-dotenv>=1.2.2",
]

[tool.ruff]
line-length = 100

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ipykernel>=7.3.0",
]
