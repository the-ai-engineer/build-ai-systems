[project]
name = "build-ai-systems"
version = "0.1.0"
description = "Public project repository for the Build AI Systems course."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "google-cloud-tasks>=2.16.0",
  "httpx>=0.28.0",
  "openai>=2.44.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.13.4",
  "pydantic-ai-slim[anthropic,google,openai]>=1.0.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.2.2",
  "uvicorn>=0.35.0",
]

[project.scripts]
apply-migrations = "support_agent_app.commands.apply_migrations:main"
seed-policies = "support_agent_app.commands.seed_policies:main"
# Demos are installed commands so they run from anywhere in the tree, the same
# way the operator commands do. `python -m examples...` only worked from the
# repository root, because Python resolved `examples` against the cwd.
demo-workflow = "support_agent_app.demos.run_workflow:main"
demo-state-machine = "support_agent_app.demos.run_state_machine:main"
demo-seed-request = "support_agent_app.demos.seed_request:main"
demo-slack-event = "support_agent_app.demos.send_slack_event:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/support_agent_app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
# The numbered lesson examples are pinned to recorded lessons. Their layout is
# part of the teaching material, so formatting must not rewrite them.
exclude = ["examples/lesson-*/*.py"]

[tool.ruff.lint.per-file-ignores]
# Same reason: these files keep their written import order and show the explicit
# `str, Enum` form on purpose, before `StrEnum` is introduced. Real error checks
# (E, F, B) still apply.
"examples/lesson-*/*.py" = ["E501", "I001", "UP042"]

[tool.pyright]
extraPaths = ["app"]
include = ["app", "examples", "tests"]

[dependency-groups]
dev = [
  "ipykernel>=7.3.0",
  "pyright>=1.1.390",
  "ruff>=0.12.0",
]
