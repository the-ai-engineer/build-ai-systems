[project]
name = "build-ai-systems"
version = "0.1.0"
description = "Public project repository for the Build AI Systems course."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "openai>=2.44.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.13.4",
  "pydantic-ai-slim[anthropic,google,openai]>=1.0.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.2.2",
  "uvicorn>=0.35.0",
]

[project.scripts]
apply-migrations = "support_agent_app.commands.apply_migrations:main"
seed-policies = "support_agent_app.commands.seed_policies:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/support_agent_app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# The early lesson examples show the explicit `str, Enum` form on purpose,
# before `StrEnum` is introduced.
"examples/0*.py" = ["UP042"]

[tool.pyright]
extraPaths = ["app"]
include = ["app", "examples", "tests"]

[dependency-groups]
dev = [
  "ipykernel>=7.3.0",
  "pyright>=1.1.390",
  "ruff>=0.12.0",
]
